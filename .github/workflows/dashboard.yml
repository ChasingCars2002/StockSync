name: Build & publish dashboard

# Builds the StockSync watchlist dashboard and publishes it to GitHub Pages.
# Open the published URL on your phone; edit watchlist.txt to change tickers.

on:
  # Rebuild whenever the watchlist or the code changes.
  push:
    branches: [claude/stock-watchlist-news-1e3qwd]
    paths:
      - watchlist.txt
      - "stocksync/**"
      - .github/workflows/dashboard.yml
  # Three weekday runs: market open, midday (~1pm ET), and market close.
  # Cron is UTC and does NOT follow daylight saving; these times match Eastern
  # Daylight Time (EDT, UTC-4). In winter (EST) they land one hour earlier in
  # ET — bump each hour up by 1 if you want to track EST exactly.
  schedule:
    - cron: "30 13 * * 1-5"   # 09:30 ET — market open
    - cron: "0 17 * * 1-5"    # 13:00 ET — midday
    - cron: "0 20 * * 1-5"    # 16:00 ET — market close
  # Allow a manual run from the Actions tab (works from the GitHub mobile site too).
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install StockSync
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build dashboard
        # --no-cache so each scheduled run fetches fresh data. --repo/--branch
        # wire up the in-page add/remove buttons to commit to watchlist.txt.
        run: |
          python -m stocksync --no-cache export \
            --watchlist-file watchlist.txt \
            --output public/index.html \
            --title "StockSync Watchlist" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --watchlist-path watchlist.txt \
            --refresh 3600

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
